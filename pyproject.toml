[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "structphy"
version = "0.0.1"
description = "Create phylogenetic trees from protein structure"
readme = "README.md"
license-files = ["native/vendor/licenses/*.txt"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Finn O'Donoghue", email = "finnodonoghue@gmail.com" }]
keywords = ["protein", "bioinformatics", "phylogenetics"]
dependencies = [
    "click>=8.1",
    "dendropy>=4.6,<6",
    "ete3>=3.1.3,<4",
    "lmfit>=1.2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "phylodm>=3.1,<4",
    "six>=1.16", # Imported by ETE 3 but missing from its package metadata.
    "tqdm>=4.65",
]

[project.urls]
Repository = "https://github.com/finnod/structural-phylogeny"

[project.scripts]
structphy = "structphy.cli:main"

[project.optional-dependencies]
folding = ["docker>=7.1,<8"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.15", "ty>=0.0.30"]
research = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "matplotlib>=3.9",
    "plotly>=6",
    "seaborn>=0.13",
]

[tool.uv]
required-version = ">=0.13"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "native/build_hook.py" },
    { file = "native/vendor/**" },
    { env = "CC" },
    { env = "CXX" },
    { env = "CPPFLAGS" },
    { env = "CFLAGS" },
    { env = "CXXFLAGS" },
    { env = "LDFLAGS" },
    { env = "MACOSX_DEPLOYMENT_TARGET" },
    { env = "SDKROOT" },
]

[tool.hatch.build]
exclude = [".DS_Store", "__pycache__", "/structphy/example_data"]

[tool.hatch.build.targets.sdist]
only-include = ["structphy", "native", "tests", "docs/build-system.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["structphy"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "native/build_hook.py"

[tool.hatch.build.targets.wheel.extra-metadata]
"native/vendor/README.md" = "native/README.md"
"native/vendor/fastme-2.1.6.4.tar.gz" = "native/fastme-2.1.6.4.tar.gz"
"native/build_hook.py" = "native/build_hook.py"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
extend-exclude = [
    "native/vendor",
    "structphy/example_data",
]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "C4", "ARG", "PTH", "PT", "TRY"]
extend-select = [
    "RET",
    "PERF",
    "N815",
    "N816",
    "N818",
    "RUF046",
    "RUF059",
    "RUF100",
]
ignore = ["SIM108"]
extend-ignore = ["RUF010", "RET504"]

[tool.ruff.lint.isort]
known-third-party = ["ete3"]

[tool.ty.src]
include = ["structphy", "tests", "native/build_hook.py"]
exclude = ["structphy/example_data", "**/*.ipynb"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["packaging: builds and installs a wheel in a fresh environment"]

[tool.ruff.lint.per-file-ignores]
"structphy/cli.py" = ["TRY003"] # Click exceptions carry user-facing messages.

[tool.ty.analysis]
allowed-unresolved-imports = [
    "docker",
    "docker.types",
    "hatchling.builders.hooks.plugin.interface",
] # Optional folding and isolated build dependencies.
